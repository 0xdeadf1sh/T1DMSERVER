[package]
name = "t1dm-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "store"
path = "src/lib.rs"

[dependencies]
t1dm_core = { path = "../core", package = "t1dm-core" }
r2d2 = "0.8.10"
r2d2_sqlite = "0.34.0"
rand = "0.10.2"
rayon = "1.12.0"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
thiserror = "2.0.18"
time = { version = "0.3.53", features = ["formatting", "parsing"] }
