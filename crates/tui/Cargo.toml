[package]
name = "t1dm-tui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "tui"
path = "src/lib.rs"

[dependencies]
t1dm_core = { path = "../core", package = "t1dm-core" }
crossterm = { version = "0.29.0", features = ["event-stream"] }
image = "0.25.10"
qrcode = "0.14.1"
ratatui = "0.30.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
store = { path = "../store", package = "t1dm-store" }
sysinfo = "0.39.5"
textwrap = "0.16.2"
time = "0.3.53"
tokio = { version = "1.52.3", features = ["rt", "sync", "time", "macros"] }
unicode-width = "0.2.2"
