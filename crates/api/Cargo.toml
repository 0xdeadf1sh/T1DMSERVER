[package]
name = "t1dm-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "api"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8.9", features = ["ws", "multipart"] }
t1dm_core = { path = "../core", package = "t1dm-core" }
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
store = { path = "../store", package = "t1dm-store" }
sysinfo = "0.39.5"
time = "0.3.53"
tokio = { version = "1.52.3", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
tracing = "0.1.44"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
