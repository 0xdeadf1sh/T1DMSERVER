[package]
name = "t1dm-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "t1dm_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
time = { version = "0.3.53", features = ["serde", "formatting", "parsing", "macros"] }
