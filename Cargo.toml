[package]
name = "t1dmserver"
description = "Single-user Type 1 Diabetes telemetry server and themed terminal dashboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
readme = "README.md"
publish = false

[[bin]]
name = "t1dmserver"
path = "src/main.rs"

[workspace]
members = ["crates/core", "crates/store", "crates/api", "crates/tui"]

[dependencies]
t1dm_core = { path = "crates/core", package = "t1dm-core" }
store = { path = "crates/store", package = "t1dm-store" }
api = { path = "crates/api", package = "t1dm-api" }
tui = { path = "crates/tui", package = "t1dm-tui" }
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
toml = "1.1.2"
serde = { version = "1.0.228", features = ["derive"] }
anyhow = "1.0.103"
notify = "8.2.0"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"
authors = ["0xdeadf1sh"]
repository = "https://github.com/0xdeadf1sh/T1DMSERVER"
